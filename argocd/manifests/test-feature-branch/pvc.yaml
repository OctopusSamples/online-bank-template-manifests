# Persistent storage for /app/data: SQLite databases, Data Protection keys and the email outbox.
# Required by the deployment; without it all accounts and sign-in keys are lost on pod restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: online-bank-data-test-feature-branch
  labels:
    app.kubernetes.io/name: online-bank-test-feature-branch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

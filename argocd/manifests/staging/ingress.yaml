apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-bank-staging
  labels:
    app.kubernetes.io/name: online-bank
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - online-bank.staging.example.com
      #secretName: online-bank-tls
  rules:
    - host: online-bank.staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: online-bank
                port:
                  name: http

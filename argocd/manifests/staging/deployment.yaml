apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bank-staging
  labels:
    app.kubernetes.io/name: online-bank-staging
spec:
  # SQLite on a ReadWriteOnce volume supports a single writer only; do not scale above 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: online-bank-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: online-bank-staging
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret    
      securityContext:
        # $APP_UID in the mcr.microsoft.com/dotnet/aspnet:9.0 image
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: online-bank
          image: ghcr.io/octopussamples/online-bank-template:1.0.10
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: Bank__DataDirectory
              value: /app/data
            # Must match the ingress host; used to build password reset links.
            - name: Bank__PublicOrigin
              value: online-bank.staging.octopussamples.com
            - name: Branding__Name
              value: Oxford Drake Credit Union
            - name: Branding__ShortName
              value: ODCU
            - name: Branding__LogoUrl
              value: 
            - name: Branding__PrimaryColor
              value: "#176a67"
            - name: Branding__SupportEmail
              value: support@oxforddrakecu.com
            - name: Branding__SupportPhone
              value: 800-555-0100
            - name: Branding__WebsiteUrl
              value: https://online-bank.staging.octopussamples.com/
            - name: Branding__LegalName
              value: Oxford Drake Credit Union
            - name: Branding__DemoNotice
              value: Demonstration only. No real money.
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: online-bank-data-staging
        - name: tmp
          emptyDir: {}

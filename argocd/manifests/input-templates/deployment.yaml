apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bank-#{Project.Environment.Name}
  labels:
    app.kubernetes.io/name: online-bank-#{Project.Environment.Name}
spec:
  # SQLite on a ReadWriteOnce volume supports a single writer only; do not scale above 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: online-bank-#{Project.Environment.Name}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: online-bank-#{Project.Environment.Name}
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret    
      securityContext:
        # $APP_UID in the mcr.microsoft.com/dotnet/aspnet:9.0 image
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: online-bank
          image: #{Octopus.Action.Package[online-bank-template].Registry}/#{Octopus.Action.Package[online-bank-template].PackageId}:#{Octopus.Action.Package[online-bank-template].PackageVersion}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: Bank__DataDirectory
              value: #{Project.Env[Bank__DataDirectory]}
            # Must match the ingress host; used to build password reset links.
            - name: Bank__PublicOrigin
              value: #{Project.Env[Bank__PublicOrigin]}
            - name: Branding__Name
              value: #{Project.Env[Branding__Name]}
            - name: Branding__ShortName
              value: #{Project.Env[Branding__ShortName]}
            - name: Branding__LogoUrl
              value: #{Project.Env[Branding__LogoUrl]}
            - name: Branding__PrimaryColor
              value: "#{Project.Env[Branding__PrimaryColor]}"
            - name: Branding__SupportEmail
              value: #{Project.Env[Branding__SupportEmail]}
            - name: Branding__SupportPhone
              value: #{Project.Env[Branding__SupportPhone]}
            - name: Branding__WebsiteUrl
              value: #{Project.Env[Branding__WebsiteUrl]}
            - name: Branding__LegalName
              value: #{Project.Env[Branding__LegalName]}
            - name: Branding__DemoNotice
              value: #{Project.Env[Branding__DemoNotice]}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: online-bank-data-#{Project.Environment.Name}
        - name: tmp
          emptyDir: {}

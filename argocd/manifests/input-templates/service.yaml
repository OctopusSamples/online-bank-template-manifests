apiVersion: v1
kind: Service
metadata:
  name: online-bank-#{Octopus.Environment.Name | ToLower}
  labels:
    app.kubernetes.io/name: online-bank-#{Octopus.Environment.Name | ToLower}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: online-bank-#{Octopus.Environment.Name | ToLower}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
